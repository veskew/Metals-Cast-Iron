<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MM&amp;E Cast Iron Project</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; height: 100%; }
    body {
      display: flex; flex-direction: column; color: #e4e2dd;
      font-family: "JetBrains Mono", ui-monospace, monospace;
      /* Faint concentric turning marks, like the machined friction face of a rotor. */
      background:
        radial-gradient(circle at 50% 55%, rgba(255, 122, 46, 0.07), transparent 55%),
        repeating-radial-gradient(circle at 50% 55%, rgba(255, 255, 255, 0.025) 0 1px, transparent 1px 7px),
        #17181a;
    }
    header { text-align: center; padding: 40px 16px 0; }
    header h1 {
      margin: 0; font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
      font-size: clamp(44px, 8vw, 92px); font-weight: 700; line-height: 0.95;
      text-transform: uppercase; letter-spacing: 0.02em;
    }
    header p { margin: 14px 0 0; font-size: clamp(12px, 1.6vw, 15px); letter-spacing: 0.12em; text-transform: uppercase; color: #a19f99; }

    /* Interactive 3D brake assembly from Sketchfab, with the required credit line under it. */
    .hero { flex: 1; min-height: 320px; display: flex; flex-direction: column; padding: 16px 16px 0; }
    .hero iframe { flex: 1; width: 100%; min-height: 0; border: 0; display: block; }
    .credit { margin: 8px 0 0; text-align: center; font-size: 12px; letter-spacing: 0.04em; color: #6f7176; }
    .credit a { color: #a19f99; }
    .credit a:hover, .credit a:focus-visible { color: #ff7a2e; }

    .actions { display: flex; justify-content: center; padding: 8px 16px 48px; }

    /* The button is a brake pad: dark at rest, glowing red-hot when you press into it. */
    .pad {
      position: relative; display: grid; place-items: center;
      width: 240px; height: 64px; border-radius: 6px 6px 22px 22px;
      font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-size: 24px; font-weight: 700;
      letter-spacing: 0.24em; text-transform: uppercase; text-decoration: none;
      color: #e4e2dd; background: linear-gradient(#3a3c41, #26282c);
      border: 1px solid #4a4c52; outline: none;
      transition: color 300ms ease, background 400ms ease, box-shadow 400ms ease, transform 150ms ease;
    }
    .pad:hover, .pad:focus-visible {
      color: #1a0d06;
      background: linear-gradient(#ffb15e, #ff6a1f 55%, #c8371a);
      box-shadow: 0 0 24px rgba(255, 106, 31, 0.55), 0 0 64px rgba(255, 70, 20, 0.3);
    }
    .pad:focus-visible { box-shadow: 0 0 0 3px #17181a, 0 0 0 5px #ff7a2e, 0 0 40px rgba(255, 106, 31, 0.5); }
    .pad:active { transform: scale(0.97); }
    @media (prefers-reduced-motion: reduce) { .pad { transition: none; } }
  </style>
</head>
<body>
  <header>
    <h1>MM&amp;E Cast Iron Project</h1>
    <p>David Barsoum · Fiona McSherry · Vishnu Eskew</p>
  </header>

  <div class="hero">
    <iframe
      title="Interactive 3D model of a brake assembly"
      src="https://sketchfab.com/models/a763a31094854e489c5e7f82e107a7d8/embed?autostart=1&amp;autospin=0.3&amp;transparent=1&amp;ui_theme=dark&amp;ui_hint=0&amp;dnt=1"
      allow="autoplay; fullscreen; xr-spatial-tracking"
      allowfullscreen></iframe>
    <p class="credit"><a href="https://sketchfab.com/3d-models/brake-assembly-update-a763a31094854e489c5e7f82e107a7d8" target="_blank" rel="nofollow noopener">Brake Assembly update</a> by <a href="https://sketchfab.com/bmcaff" target="_blank" rel="nofollow noopener">bmcaff</a> on <a href="https://sketchfab.com" target="_blank" rel="nofollow noopener">Sketchfab</a></p>
  </div>

  <div class="actions">
    <a class="pad" href="project.html">Recast</a>
  </div>
</body>
</html>
